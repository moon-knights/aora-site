<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به جلسه — آرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<nav class="nav" id="mainNav"><div class="container">
<a href="/" class="nav-logo">آ<span>را</span></a>
<a href="/meetings" style="font-size:.75rem;color:var(--text-muted)">بازگشت به لیست جلسات</a>
</div></nav>

<div class="meeting-lobby">
<div class="lobby-card">

<!-- پیش‌نمایش دوربین -->
<div class="lobby-preview">
<div class="cam-active" id="cameraPreview">
<div class="avatar-big" id="lobbyAvatar">ع م</div>
</div>
<div class="lobby-controls">
<button class="lobby-ctrl-btn on" id="toggleCam" title="دوربین">📷</button>
<button class="lobby-ctrl-btn on" id="toggleMic" title="میکروفون">🎤</button>
</div>
</div>

<!-- تنظیمات ورود -->
<div class="lobby-settings">
<h2 id="lobbyTitle">جلسه جدید</h2>
<p id="lobbyCode" style="font-family:var(--font-mono);font-size:.78rem;color:var(--text-muted);direction:ltr"></p>

<input type="text" id="lobbyName" class="lobby-input" placeholder="نام نمایشی شما" style="margin-top:1rem">

<div class="lobby-options">
<div class="lobby-opt selected" data-opt="cam-on">
<div class="radio"></div>
<span>📷</span>
<div class="info"><div class="name">دوربین روشن</div><div class="desc">ویدیوی شما برای دیگران نمایش داده می‌شود</div></div>
</div>
<div class="lobby-opt" data-opt="cam-off">
<div class="radio"></div>
<span>🚫</span>
<div class="info"><div class="name">فقط صوتی</div><div class="desc">بدون ویدیو، فقط صدا</div></div>
</div>
</div>

<button class="btn-primary" id="joinBtn" style="width:100%;justify-content:center;padding:1rem;font-size:.95rem;margin-top:1rem">
ورود به جلسه <span class="arrow">&larr;</span>
</button>

<div class="invite-code-box" id="inviteBox" style="margin-top:1.5rem">
<div style="font-size:.72rem;color:var(--text-muted)">کد دعوت جلسه</div>
<div class="code" id="inviteCode"></div>
<button class="copy-btn" id="copyInvite">کپی کد</button>
</div>

</div>
</div>
</div>

<script src="js/app.js"></script>
<script src="js/meeting.js"></script>
<script src="js/access.js"></script>
<script>
$(document).ready(function(){
  var params = new URLSearchParams(window.location.search);
  var meetingId = params.get('id');
  var userName = params.get('name') || '';

  var camOn = true;
  var micOn = true;

  // بارگذاری اطلاعات جلسه
  if(meetingId){
    var meeting = Meeting.getById(meetingId);
    if(meeting){
      $('#lobbyTitle').text(meeting.title);
      $('#lobbyCode').text(meeting.code);
      $('#inviteCode').text(meeting.code);
    }
  }

  if(userName){
    $('#lobbyName').val(decodeURIComponent(userName));
    var initials = Meeting.getInitials(decodeURIComponent(userName));
    $('#lobbyAvatar').text(initials);
  }

  // نام
  $('#lobbyName').on('input', function(){
    var v = $(this).val().trim();
    if(v) $('#lobbyAvatar').text(Meeting.getInitials(v));
  });

  // انتخاب حالت
  $('.lobby-opt').on('click', function(){
    $('.lobby-opt').removeClass('selected');
    $(this).addClass('selected');
    camOn = $(this).data('opt') === 'cam-on';
    if(camOn){
      $('#cameraPreview').show();
      $('#toggleCam').removeClass('off').addClass('on').text('📷');
    } else {
      $('#cameraPreview').hide();
      $('#toggleCam').removeClass('on').addClass('off').text('🚫');
    }
  });

  // دکمه‌های کنترل
  $('#toggleCam').on('click', function(){
    camOn = !camOn;
    $(this).toggleClass('on off').text(camOn ? '📷' : '🚫');
    if(camOn) $('#cameraPreview').show(); else $('#cameraPreview').hide();
  });

  $('#toggleMic').on('click', function(){
    micOn = !micOn;
    $(this).toggleClass('on off').text(micOn ? '🎤' : '🔇');
  });

  // ورود
  $('#joinBtn').on('click', function(){
    var name = $('#lobbyName').val().trim();
    if(!name){ alert('نام خود را وارد کنید.'); return; }
    window.location.href = 'meeting-room?id=' + (meetingId || '') + '&name=' + encodeURIComponent(name) + '&cam=' + camOn + '&mic=' + micOn;
  });

  // کپی دعوت
  $('#copyInvite').on('click', function(){
    var code = $('#inviteCode').text();
    if(navigator.clipboard) navigator.clipboard.writeText(code);
    $(this).text('کپی شد!');
    setTimeout(function(){ $('#copyInvite').text('کپی کد'); }, 2000);
  });
});
</script>
</body>
</html>
