<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نتایج نظرسنجی — آرا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<nav class="nav" id="mainNav"><div class="container">
<a href="/" class="nav-logo">آ<span>را</span></a>
<div style="display:flex;align-items:center;gap:1rem">
<a href="/surveys" style="font-size:.75rem;color:var(--text-muted)">بازگشت به لیست</a>
</div>
</div></nav>

<div class="tool-page">
<div class="container" style="max-width:800px;padding-top:2rem">
<div id="resultsHeader" style="margin-bottom:2rem"></div>
<div id="resultsContent"></div>
</div>
</div>

<script src="js/app.js"></script>
<script src="js/access.js"></script>
<script src="js/survey.js"></script>
<script>
$(document).ready(function(){
  var surveyId = new URLSearchParams(window.location.search).get('id');
  if(!surveyId){
    $('#resultsContent').html('<div style="text-align:center;padding:4rem"><h2>شناسه یافت نشد.</h2></div>');
    return;
  }

  var survey = Survey.getById(surveyId);
  if(!survey){
    $('#resultsContent').html('<div style="text-align:center;padding:4rem"><h2>نظرسنجی یافت نشد.</h2></div>');
    return;
  }

  // هدر
  var h = '<h1 style="font-size:1.3rem;font-weight:600;color:var(--text-primary);margin-bottom:.25rem">📊 ' + survey.title + '</h1>';
  if(survey.description) h += '<p style="font-size:.82rem;color:var(--text-muted)">' + survey.description + '</p>';
  h += '<div style="display:flex;gap:1rem;margin-top:1rem">';
  h += '<a href="/survey-view?id=' + survey.id + '" class="btn-ghost" style="padding:.4rem .8rem;font-size:.72rem">مشاهده نظرسنجی</a>';
  h += '<button onclick="exportCSV()" class="btn-ghost" style="padding:.4rem .8rem;font-size:.72rem">📥 خروجی CSV</button>';
  h += '</div>';
  $('#resultsHeader').html(h);

  // نتایج
  $('#resultsContent').html(Survey.renderResults(survey));

  // انیمیشن نوارها
  setTimeout(function(){
    $('.bar-fill').each(function(){ $(this).css('width', $(this).css('width')); });
  }, 100);

  // خروجی CSV
  window.exportCSV = function(){
    var analysis = Survey.analyzeResults(survey);
    var responses = analysis.responses;
    if(responses.length === 0){ alert('پاسخی برای خروجی وجود ندارد.'); return; }

    var csv = '\uFEFF'; // BOM for UTF-8
    survey.questions.forEach(function(q, i){
      csv += (i > 0 ? ',' : '') + '"' + q.text.replace(/"/g, '""') + '"';
    });
    csv += '\n';

    responses.forEach(function(r){
      survey.questions.forEach(function(q, i){
        var val = r.answers[q.id] || '';
        if(Array.isArray(val)) val = val.join(' | ');
        csv += (i > 0 ? ',' : '') + '"' + String(val).replace(/"/g, '""') + '"';
      });
      csv += '\n';
    });

    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = survey.title + '_results.csv';
    link.click();
  };
});
</script>
</body>
</html>
