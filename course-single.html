<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات دوره — آئورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
/* ── صفحه دوره ── */
.cs-wrap{padding-top:80px;min-height:100vh}
.cs-hero{background:linear-gradient(180deg,var(--bg-surface),var(--bg-deep));padding:2.5rem 0}
.cs-crumb{font-size:.72rem;color:var(--text-muted);margin-bottom:1rem}
.cs-crumb a{color:var(--text-muted);text-decoration:none}
.cs-crumb a:hover{color:var(--accent)}
.cs-hero-grid{display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start}
.cs-icon{font-size:3rem;margin-bottom:1rem}
.cs-title{font-size:1.6rem;font-weight:800;color:var(--text-primary);margin-bottom:.75rem;line-height:1.5}
.cs-desc{font-size:.9rem;color:var(--text-muted);line-height:2;margin-bottom:1.25rem}
.cs-meta{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.78rem;color:var(--text-muted);margin-bottom:1rem}
.cs-meta span{display:flex;align-items:center;gap:5px}
.cs-tags{display:flex;gap:.4rem;flex-wrap:wrap}
.cs-tags span{padding:.2rem .6rem;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:.68rem;color:var(--text-muted)}
.cs-instructor-chip{display:flex;align-items:center;gap:.6rem;margin-top:1.25rem}
.cs-instructor-chip .av{width:38px;height:38px;border-radius:50%;background:var(--accent-glow);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.cs-instructor-chip .nm{font-size:.82rem;color:var(--text-primary);font-weight:600}
.cs-instructor-chip .rl{font-size:.68rem;color:var(--text-muted)}

/* کارت ثبت‌نام */
.cs-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;position:sticky;top:100px}
.cs-card-thumb{width:100%;height:180px;border-radius:var(--radius-md);overflow:hidden;margin-bottom:1rem;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,#1a237e,#283593)}
.cs-card-thumb img{width:100%;height:100%;object-fit:cover}
.cs-card-price{font-size:1.5rem;font-weight:800;color:var(--accent);margin-bottom:.5rem}
.cs-card-price.free{color:#2ecc71}
.cs-card-original{font-size:.85rem;color:var(--text-muted);text-decoration:line-through;margin-right:.5rem}
.cs-card-btn{width:100%;padding:.85rem;background:var(--accent);border:none;border-radius:var(--radius-md);color:#000;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:.75rem;transition:all var(--ease)}
.cs-card-btn:hover{opacity:.9}
.cs-card-btn.enrolled{background:#2ecc71;color:#fff}
.cs-card-info{font-size:.75rem;color:var(--text-muted);line-height:2;margin-top:1rem}
.cs-card-info div{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}

/* محتوای دوره */
.cs-body{padding:2.5rem 0}
.cs-body-grid{display:grid;grid-template-columns:1fr 340px;gap:2rem}
.cs-section-title{font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:1.25rem;display:flex;align-items:center;gap:.5rem}

/* ویدیو پلیر */
.video-player-wrap{background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.5rem;position:relative;aspect-ratio:16/9}
.video-player-wrap video{width:100%;height:100%;object-fit:contain}
.video-player-wrap .no-video{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);font-size:1rem;flex-direction:column;gap:.5rem}
.video-player-wrap .no-video .icon{font-size:3rem}
.video-now-playing{font-size:.85rem;font-weight:600;color:var(--text-primary);margin-bottom:.5rem;padding:.5rem 0;display:flex;align-items:center;gap:.5rem}
.video-now-playing .play-icon{color:var(--accent)}

/* سرفصل‌ها */
.chapters-accordion{display:flex;flex-direction:column;gap:.75rem}
.chapter-acc{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.chapter-acc-header{display:flex;align-items:center;gap:.5rem;padding:1rem 1.25rem;cursor:pointer;transition:all var(--ease);user-select:none}
.chapter-acc-header:hover{background:var(--bg-surface)}
.chapter-acc-header .ch-icon{font-size:1rem;transition:transform .3s}
.chapter-acc-header.open .ch-icon{transform:rotate(180deg)}
.chapter-acc-header .ch-title{flex:1;font-size:.88rem;font-weight:600;color:var(--text-primary)}
.chapter-acc-header .ch-count{font-size:.7rem;color:var(--text-muted);background:var(--bg-surface);padding:.2rem .6rem;border-radius:20px}
.chapter-acc-body{display:none;padding:0 1.25rem 1rem}
.chapter-acc-body.open{display:block}
.lesson-list{display:flex;flex-direction:column;gap:.35rem}
.lesson-row{display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--ease);border:1px solid transparent}
.lesson-row:hover{background:var(--bg-surface);border-color:var(--border)}
.lesson-row.active{background:var(--accent-dim);border-color:var(--accent-dim)}
.lesson-row .les-num{font-size:.72rem;color:var(--accent);font-weight:700;width:22px;text-align:center}
.lesson-row .les-title{flex:1;font-size:.82rem;color:var(--text-primary)}
.lesson-row .les-duration{font-size:.7rem;color:var(--text-muted)}
.lesson-row .les-status{font-size:.7rem}
.lesson-row .les-status.has-video{color:#2ecc71}
.lesson-row .les-status.no-video{color:var(--text-muted)}
.lesson-row .les-download{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.85rem;padding:.2rem;border-radius:var(--radius-sm);transition:all var(--ease)}
.lesson-row .les-download:hover{color:var(--accent);background:var(--accent-dim)}
.lesson-row .les-download[disabled]{opacity:.3;cursor:not-allowed}

/* تب‌ها */
.course-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.5rem}
.course-tab{padding:.75rem 1.25rem;font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--ease)}
.course-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.tab-content p{font-size:.85rem;color:var(--text-muted);line-height:2}

/* ریسپانسیو */
@media(max-width:1024px){
  .cs-hero-grid,.cs-body-grid{grid-template-columns:1fr}
  .cs-card{position:static}
}
@media(max-width:768px){
  .cs-title{font-size:1.2rem}
  .video-player-wrap{aspect-ratio:auto;min-height:200px}
}
</style>
</head>
<body>

<nav class="nav" id="mainNav"><div class="container">
<a href="/" class="nav-logo">آئو<span>را</span></a>
<ul class="nav-links">
  <li><a href="/">خانه</a></li>
  <li><a href="/courses">خدمات و دوره‌ها</a></li>
  <li><a href="/forum">تالار گفتگو</a></li>
  <li><a href="/about">درباره ما</a></li>
</ul>
<div class="nav-actions">
  <a href="/cart" class="nav-cart">🛒 <span id="cartCount">0</span></a>
  <div id="authArea"></div>
</div>
<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
</div></nav>

<div class="cs-wrap">

  <!-- هیرو -->
  <div class="cs-hero">
    <div class="container">
      <div class="cs-crumb"><a href="/">خانه</a> / <a href="/courses">دوره‌ها</a> / <span id="crumbTitle">...</span></div>
      <div class="cs-hero-grid">
        <div>
          <div class="cs-icon" id="courseIcon">🎬</div>
          <h1 class="cs-title" id="courseTitle">در حال بارگذاری...</h1>
          <p class="cs-desc" id="courseDesc"></p>
          <div class="cs-meta" id="courseMeta"></div>
          <div class="cs-tags" id="courseTags"></div>
          <div class="cs-instructor-chip" id="courseInstructor">
            <div class="av">?</div>
            <div><div class="nm">...</div><div class="rl">ارائه‌دهنده</div></div>
          </div>
        </div>
        <div>
          <div class="cs-card">
            <div class="cs-card-thumb" id="cardThumb">🎬</div>
            <div class="cs-card-price" id="cardPrice">رایگان</div>
            <button class="cs-card-btn" id="enrollBtn">ثبت‌نام در دوره</button>
            <div class="cs-card-info" id="cardInfo"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- بدنه -->
  <div class="cs-body">
    <div class="container">
      <div class="cs-body-grid">
        <div>
          <!-- ویدیو پلیر -->
          <div class="video-now-playing" id="nowPlaying"><span class="play-icon">▶</span> <span id="nowPlayingTitle">درسی رو انتخاب کن</span></div>
          <div class="video-player-wrap" id="videoPlayerWrap">
            <div class="no-video" id="noVideoMsg">
              <div class="icon">🎬</div>
              <div>یه درس از لیست زیر انتخاب کن</div>
            </div>
            <video id="videoPlayer" controls style="display:none">
              <source id="videoSource" src="" type="video/mp4">
              مرورگر شما از ویدیو پشتیبانی نمی‌کنه.
            </video>
          </div>

          <!-- تب‌ها -->
          <div class="course-tabs">
            <div class="course-tab active" data-tab="overview">درباره دوره</div>
            <div class="course-tab" data-tab="chapters">سرفصل‌ها</div>
          </div>
          <div class="tab-content active" id="tab-overview">
            <p id="overviewText"></p>
          </div>
          <div class="tab-content" id="tab-chapters">
            <div class="chapters-accordion" id="chaptersAccordion"></div>
          </div>
        </div>

        <!-- سایدبار -->
        <div>
          <div class="cs-card" style="position:static">
            <h3 style="font-size:.95rem;font-weight:700;margin-bottom:1rem">📚 سرفصل‌ها</h3>
            <div id="sidebarChapters"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><span>© ۱۴۰۵ آئورا</span></div></div></footer>

<script src="js/ajax.js"></script>
<script src="js/app.js"></script>
<script>
$(document).ready(function () {
  /* ═══ دریافت ID دوره ═══ */
  var params = new URLSearchParams(window.location.search);
  var courseId = params.get('id');
  if (!courseId) { window.location.href = '/courses'; return; }

  /* ═══ پیدا کردن دوره ═══ */
  var course = null;
  API.get('/courses/' + courseId).done(function (data) {
    course = data;
    initPage();
  }).fail(function () {
    // تلاش برای پیدا کردن از داده‌های پیش‌فرض
    if (typeof API.getDefaultCourses === 'function') {
      var defaults = API.getDefaultCourses();
      course = defaults.find(function(c) { return c.id === courseId; });
    }
    if (!course) {
      $('body').html('<div style="text-align:center;padding:10rem 2rem"><h1>😔 دوره پیدا نشد</h1><p style="color:var(--text-muted);margin:1rem 0">این دوره وجود ندارد یا حذف شده است.</p><a href="/courses" class="btn-primary" style="padding:.7rem 2rem;text-decoration:none">بازگشت به بازارچه</a></div>');
      return;
    }
    initPage();
  });

  function initPage() {

  /* ═══ پر کردن اطلاعات ═══ */
  document.title = course.title + ' — آئورا';
  $('#crumbTitle').text(course.title);
  $('#courseTitle').text(course.title);
  $('#courseDesc').text(course.description || '');
  $('#overviewText').text(course.description || 'توضیحات تکمیلی برای این دوره ثبت نشده است.');

  // آیکون
  var icon = course.icon || '🎬';
  $('#courseIcon').text(icon);

  // تصویر
  if (course.thumbnail) {
    $('#cardThumb').html('<img src="' + course.thumbnail + '" alt="' + course.title + '">');
  }

  // متا
  var metaHtml = '';
  if (course.chapters) {
    var totalLessons = 0;
    course.chapters.forEach(function(ch) { totalLessons += (ch.lessons ? ch.lessons.length : 0); });
    metaHtml += '<span>📚 ' + course.chapters.length + ' سرفصل</span>';
    metaHtml += '<span>🎬 ' + totalLessons + ' درس</span>';
  }
  if (course.level) metaHtml += '<span>📊 ' + course.level + '</span>';
  if (course.duration) metaHtml += '<span>⏱ ' + course.duration + '</span>';
  if (course.students) metaHtml += '<span>👥 ' + course.students + ' دانشجو</span>';
  if (course.rating) metaHtml += '<span>⭐ ' + course.rating + '</span>';
  $('#courseMeta').html(metaHtml);

  // تگ‌ها
  if (course.tags && course.tags.length) {
    $('#courseTags').html(course.tags.map(function(t) { return '<span>' + t + '</span>'; }).join(''));
  }

  // مدرس
  var initial = (course.instructor || '?').charAt(0);
  $('#courseInstructor').html(
    '<div class="av">' + initial + '</div>' +
    '<div><div class="nm">' + (course.instructor || 'نامشخص') + '</div><div class="rl">ارائه‌دهنده دوره</div></div>'
  );

  // قیمت
  if (course.price > 0) {
    var priceHtml = '';
    if (course.originalPrice && course.originalPrice > course.price) {
      priceHtml += '<span class="cs-card-original">' + formatPrice(course.originalPrice) + '</span>';
    }
    priceHtml += formatPrice(course.price) + ' تومان';
    $('#cardPrice').html(priceHtml);
  } else {
    $('#cardPrice').addClass('free').text('رایگان');
  }

  // اطلاعات کارت
  var cardInfoHtml = '';
  if (course.certificate !== false) cardInfoHtml += '<div>✅ گواهی پایان دوره</div>';
  cardInfoHtml += '<div>📱 دسترسی همیشگی</div>';
  cardInfoHtml += '<div>💬 پشتیبانی آنلاین</div>';
  if (course.chapters) {
    var totalL = 0;
    course.chapters.forEach(function(ch) { totalL += (ch.lessons ? ch.lessons.length : 0); });
    cardInfoHtml += '<div>🎬 ' + totalL + ' ویدیوی آموزشی</div>';
  }
  $('#cardInfo').html(cardInfoHtml);

  /* ═══ بررسی ثبت‌نام ═══ */
  var user = JSON.parse(localStorage.getItem('aoura_user') || 'null');
  var enrollments = JSON.parse(localStorage.getItem('aora_enrollments') || '[]');
  var isEnrolled = user && enrollments.some(function(e) { return e.userId === user.id && e.courseId === courseId; });

  if (isEnrolled) {
    $('#enrollBtn').addClass('enrolled').text('✅ ثبت‌نام شده — ادامه یادگیری');
  }

  $('#enrollBtn').on('click', function() {
    if (!user) {
      alert('برای ثبت‌نام اول باید وارد بشی');
      window.location.href = '/login';
      return;
    }
    if (isEnrolled) {
      // اسکرول به ویدیو
      $('html, body').animate({ scrollTop: $('#videoPlayerWrap').offset().top - 100 }, 500);
      return;
    }
    enrollments.push({
      userId: user.id,
      courseId: courseId,
      enrolledAt: new Date().toISOString(),
      progress: 0,
      completedLessons: []
    });
    localStorage.setItem('aora_enrollments', JSON.stringify(enrollments));
    isEnrolled = true;
    $(this).addClass('enrolled').text('✅ ثبت‌نام شده — ادامه یادگیری');
    alert('🎉 ثبت‌نام با موفقیت انجام شد!\nحالا می‌تونی ویدیوها رو ببینی.');
  });

  /* ═══ سرفصل‌ها و ویدیوها ═══ */
  var currentVideoUrl = '';

  function renderChapters() {
    if (!course.chapters || !course.chapters.length) {
      $('#chaptersAccordion').html('<div style="text-align:center;padding:2rem;color:var(--text-muted)">هنوز سرفصلی ثبت نشده</div>');
      $('#sidebarChapters').html('<div style="font-size:.8rem;color:var(--text-muted)">هنوز سرفصلی ثبت نشده</div>');
      return;
    }

    var accHtml = '';
    var sideHtml = '';

    course.chapters.forEach(function(ch, ci) {
      var lessonsHtml = '';
      var sideLessonsHtml = '';

      (ch.lessons || []).forEach(function(les, li) {
        var hasVideo = les.video && les.video.trim();
        var canDownload = hasVideo && (les.video.indexOf('.mp4') > -1 || les.video.indexOf('.mkv') > -1 || les.video.indexOf('.webm') > -1);

        lessonsHtml += '<div class="lesson-row" data-ch="' + ci + '" data-les="' + li + '" onclick="playLesson(' + ci + ',' + li + ')">' +
          '<div class="les-num">' + (li + 1) + '</div>' +
          '<div class="les-title">' + les.title + '</div>' +
          (les.duration ? '<div class="les-duration">' + les.duration + '</div>' : '') +
          '<div class="les-status ' + (hasVideo ? 'has-video' : 'no-video') + '">' + (hasVideo ? '🎬' : '📄') + '</div>' +
          (canDownload ? '<button class="les-download" onclick="event.stopPropagation();downloadVideo(\'' + les.video + '\',\'' + les.title + '\')" title="دانلود">⬇️</button>' : '<button class="les-download" disabled title="دانلود غیرفعال">⬇️</button>') +
        '</div>';

        sideLessonsHtml += '<div style="display:flex;align-items:center;gap:.4rem;padding:.4rem 0;font-size:.78rem;cursor:pointer" onclick="playLesson(' + ci + ',' + li + ')">' +
          '<span style="color:var(--accent);font-size:.7rem">' + (li + 1) + '</span>' +
          '<span style="color:var(--text-primary);flex:1">' + les.title + '</span>' +
          (hasVideo ? '<span style="color:#2ecc71;font-size:.65rem">🎬</span>' : '') +
        '</div>';
      });

      accHtml += '<div class="chapter-acc">' +
        '<div class="chapter-acc-header" onclick="toggleChapterAcc(this)">' +
          '<span class="ch-icon">▼</span>' +
          '<span class="ch-title">' + ch.title + '</span>' +
          '<span class="ch-count">' + (ch.lessons ? ch.lessons.length : 0) + ' درس</span>' +
        '</div>' +
        '<div class="chapter-acc-body">' +
          '<div class="lesson-list">' + lessonsHtml + '</div>' +
        '</div>' +
      '</div>';

      sideHtml += '<div style="margin-bottom:1rem">' +
        '<div style="font-size:.82rem;font-weight:600;color:var(--text-primary);margin-bottom:.4rem">' + ch.title + '</div>' +
        sideLessonsHtml +
      '</div>';
    });

    $('#chaptersAccordion').html(accHtml);
    $('#sidebarChapters').html(sideHtml);

    // باز کردن اولین سرفصل
    if (course.chapters.length > 0) {
      var firstHeader = $('.chapter-acc-header').first();
      firstHeader.addClass('open');
      firstHeader.next('.chapter-acc-body').addClass('open');
    }
  }

  window.toggleChapterAcc = function(el) {
    $(el).toggleClass('open');
    $(el).next('.chapter-acc-body').toggleClass('open');
  };

  window.playLesson = function(ci, li) {
    var les = course.chapters[ci].lessons[li];
    if (!les || !les.video) {
      alert('ویدیویی برای این درس ثبت نشده');
      return;
    }

    // بررسی ثبت‌نام
    if (!isEnrolled && course.price > 0) {
      alert('برای مشاهده ویدیو اول باید ثبت‌نام کنی');
      return;
    }

    currentVideoUrl = les.video;
    var videoEl = document.getElementById('videoPlayer');
    var sourceEl = document.getElementById('videoSource');

    sourceEl.src = les.video;
    videoEl.load();
    videoEl.style.display = 'block';
    $('#noVideoMsg').hide();
    $('#nowPlayingTitle').text(les.title);

    // هایلایت درس فعال
    $('.lesson-row').removeClass('active');
    $('.lesson-row[data-ch=' + ci + '][data-les=' + li + ']').addClass('active');

    // اسکرول به ویدیو
    $('html, body').animate({ scrollTop: $('#videoPlayerWrap').offset().top - 100 }, 300);
  };

  window.downloadVideo = function(url, title) {
    if (!isEnrolled && course.price > 0) {
      alert('برای دانلود ویدیو اول باید ثبت‌نام کنی');
      return;
    }
    var a = document.createElement('a');
    a.href = url;
    a.download = (title || 'video') + '.mp4';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  /* ═══ تب‌ها ═══ */
  $('.course-tab').on('click', function() {
    var tab = $(this).data('tab');
    $('.course-tab').removeClass('active');
    $(this).addClass('active');
    $('.tab-content').removeClass('active');
    $('#tab-' + tab).addClass('active');
  });

  /* ═══ منوی موبایل ═══ */
  $('#mobileMenuBtn').on('click', function() { $('.nav-links').toggleClass('open'); });

  /* ═══ مقداردهی ═══ */
  renderChapters();

  } /* end initPage */
});
</script>

</body>
</html>
