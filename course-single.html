<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>جزئیات دوره — آئورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
/* ── استایل‌های اختصاصی صفحه جزئیات دوره ── */
.cs-wrap{padding-top:80px;min-height:100vh}
.cs-hero{background:linear-gradient(180deg,var(--bg-surface),var(--bg-deep));padding:2.5rem 0}
.cs-crumb{font-size:.72rem;color:var(--text-muted);margin-bottom:1rem}
.cs-crumb a{color:var(--text-muted)}
.cs-hero-grid{display:grid;grid-template-columns:1fr 340px;gap:2rem;align-items:start}
.cs-icon{font-size:3rem;margin-bottom:1rem}
.cs-title{font-size:1.6rem;font-weight:800;color:var(--text-primary);margin-bottom:.75rem;line-height:1.5}
.cs-desc{font-size:.9rem;color:var(--text-muted);line-height:2;margin-bottom:1.25rem}
.cs-meta{display:flex;gap:1.25rem;flex-wrap:wrap;font-size:.78rem;color:var(--text-muted);margin-bottom:1rem}
.cs-meta span{display:flex;align-items:center;gap:5px}
.cs-tags{display:flex;gap:.4rem;flex-wrap:wrap}
.cs-tags span{padding:.2rem .6rem;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:.68rem;color:var(--text-muted)}
.cs-instructor-chip{display:flex;align-items:center;gap:.6rem;margin-top:1.25rem}
.cs-instructor-chip .av{width:38px;height:38px;border-radius:50%;background:var(--accent-glow);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.cs-instructor-chip .nm{font-size:.82rem;color:var(--text-primary);font-weight:600}
.cs-instructor-chip .rl{font-size:.68rem;color:var(--text-muted)}

/* ── کارت ثبت‌نام sticky ── */
.cs-buy-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;position:sticky;top:90px}
.cs-price-row{display:flex;align-items:baseline;gap:.6rem;margin-bottom:1rem}
.cs-price-current{font-size:1.4rem;font-weight:800;color:var(--accent);font-family:var(--font-mono);direction:ltr}
.cs-price-original{font-size:.8rem;color:var(--text-muted);text-decoration:line-through}
.cs-price-free{font-size:1.2rem;font-weight:700;color:#4caf50}
.cs-buy-btn{width:100%;padding:.85rem;background:var(--accent);color:var(--bg-deep);border:none;border-radius:var(--radius-md);font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--font-fa);margin-bottom:.75rem;transition:all var(--ease)}
.cs-buy-btn:hover{box-shadow:0 8px 24px rgba(232,197,71,.3)}
.cs-buy-btn.secondary{background:var(--bg-surface);color:var(--accent);border:1px solid var(--accent)}
.cs-buy-facts{list-style:none;padding:0;margin-top:1rem;font-size:.76rem;color:var(--text-muted)}
.cs-buy-facts li{display:flex;justify-content:space-between;padding:.5rem 0;border-top:1px solid var(--border)}

/* ── بدنه ── */
.cs-section{margin-bottom:2rem}
.cs-section h2{font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:1rem}
.chapter-block{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:.75rem;overflow:hidden}
.chapter-head{padding:.9rem 1.1rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text-primary)}
.chapter-head .ch-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent-glow);color:var(--accent);font-size:.7rem;margin-left:.5rem}
.chapter-head .ch-count{font-size:.68rem;color:var(--text-muted);font-weight:400}
.chapter-lessons{display:none;border-top:1px solid var(--border)}
.chapter-block.open .chapter-lessons{display:block}
.chapter-block.open .chevron{transform:rotate(180deg)}
.lesson-preview-row{padding:.7rem 1.1rem;display:flex;align-items:center;gap:.6rem;font-size:.78rem;color:var(--text-muted);border-top:1px solid var(--border)}
.lesson-preview-row:first-child{border-top:none}
.related-scroll{display:flex;gap:1rem;overflow-x:auto;padding-bottom:.5rem}
.related-card{min-width:220px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:1rem;text-decoration:none;flex-shrink:0;transition:all var(--ease)}
.related-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
.related-card .r-icon{font-size:1.8rem;margin-bottom:.5rem}
.related-card .r-title{font-size:.8rem;font-weight:600;color:var(--text-primary);margin-bottom:.4rem;line-height:1.5}
.related-card .r-price{font-size:.78rem;color:var(--accent);font-family:var(--font-mono)}
.cs-notfound{text-align:center;padding:5rem 1.5rem}
@media(max-width:860px){.cs-hero-grid{grid-template-columns:1fr}.cs-buy-card{position:static}}
</style>
</head>
<body>

<!-- ═══ ناوبری ═══ -->
<nav class="nav" id="mainNav"><div class="container">
<a href="index.html" class="nav-logo">آئو<span>را</span></a>
<ul class="nav-links">
  <li><a href="index.html">خانه</a></li>
  <li><a href="courses.html" class="active">بازارچه دوره‌ها</a></li>
  <li><a href="professors.html">اساتید</a></li>
  <li><a href="forum.html">تالار گفتگو</a></li>
  <li><a href="resources.html">منابع</a></li>
  <li><a href="research.html">پژوهش</a></li>
  <li><a href="about.html">درباره ما</a></li>
</ul>
<div class="nav-actions">
  <a href="cart.html" class="nav-cart">🛒 <span id="cartCount">0</span></a>
  <div id="authArea"></div>
<button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
</div>
</div></nav>

<div class="cs-wrap" id="csWrap">
  <div class="container">
    <p style="padding-top:1.5rem" class="cs-crumb">در حال بارگذاری…</p>
  </div>
</div>

<!-- ═══ فوتر ═══ -->
<footer class="footer"><div class="container">
<div class="footer-grid">
  <div>
    <div class="footer-logo">آئو<span>را</span></div>
    <p class="footer-about">پلتفرم آموزش مدرن علوم زیستی و بیوانفارماتیک</p>
  </div>
  <div>
    <h4 class="footer-title">لینک‌ها</h4>
    <ul class="footer-links">
      <li><a href="courses.html">بازارچه دوره‌ها</a></li>
      <li><a href="professors.html">اساتید</a></li>
      <li><a href="forum.html">تالار گفتگو</a></li>
    </ul>
  </div>
  <div>
    <h4 class="footer-title">پشتیبانی</h4>
    <ul class="footer-links">
      <li><a href="about.html">درباره ما</a></li>
      <li><a href="faq.html">سوالات</a></li>
    </ul>
  </div>
</div>
<div class="footer-bottom">
  <span>© ۱۴۰۵ آئورا</span>
  <span>support@aoura.ir</span>
</div>
</div></footer>

<!-- ═══ اسکریپت‌ها ═══ -->
<script src="js/content-manager.js"></script>
<script src="js/ajax.js"></script>
<script src="js/app.js"></script>
<script>
$(document).ready(function () {

  var courseId = new URLSearchParams(window.location.search).get('id');

  if (!courseId) {
    $('#csWrap .container').html(
      '<div class="cs-notfound"><div style="font-size:3rem;opacity:.3;margin-bottom:1rem">🔍</div>' +
      '<h3 style="color:var(--text-muted);margin-bottom:.5rem">شناسه دوره مشخص نشده است</h3>' +
      '<a href="courses.html" class="btn-primary">بازگشت به بازارچه دوره‌ها</a></div>'
    );
    return;
  }

  API.get('/courses').done(function (courses) {
    var c = (courses || []).find(function (x) { return String(x.id) === String(courseId); });

    if (!c) {
      $('#csWrap .container').html(
        '<div class="cs-notfound"><div style="font-size:3rem;opacity:.3;margin-bottom:1rem">😕</div>' +
        '<h3 style="color:var(--text-muted);margin-bottom:.5rem">این دوره یافت نشد</h3>' +
        '<a href="courses.html" class="btn-primary">بازگشت به بازارچه دوره‌ها</a></div>'
      );
      return;
    }

    document.title = c.title + ' — آئورا';
    render(c, courses);
  });

  function render(c, allCourses) {
    var enrolled = (typeof Payment !== 'undefined' && Payment.isEnrolled) ? Payment.isEnrolled(c.id) : false;
    var inCart = (typeof Cart !== 'undefined' && Cart.getItems) ? Cart.getItems().indexOf(c.id) >= 0 : false;
    var disc = c.originalPrice > c.price ? Math.round(100 - (c.price / c.originalPrice) * 100) : 0;

    var chapters = c.chapters;
    if (typeof chapters === 'string') { try { chapters = JSON.parse(chapters); } catch (e) { chapters = []; } }
    if (!chapters || !chapters.length) chapters = [{ title: 'محتوای دوره', lessons: 5 }];
    var totalLessons = chapters.reduce(function (s, ch) { return s + (ch.lessons || 0); }, 0);

    var html = '';

    // ── هیرو ──
    html += '<div class="cs-hero"><div class="container"><div class="cs-crumb"><a href="courses.html">بازارچه دوره‌ها</a> / ' + c.title + '</div>';
    html += '<div class="cs-hero-grid">';
    html += '  <div><div class="cs-icon">' + (c.icon || '📚') + '</div>';
    html += '  <h1 class="cs-title">' + c.title + '</h1>';
    html += '  <p class="cs-desc">' + (c.description || '') + '</p>';
    html += '  <div class="cs-meta">';
    html += '    <span>⭐ ' + (c.rating || 0) + '</span>';
    html += '    <span>👥 ' + (c.students || 0).toLocaleString('fa-IR') + ' دانشجو</span>';
    html += '    <span>⏱ ' + (c.duration || '') + '</span>';
    html += '    <span>🎓 ' + (c.level || '') + '</span>';
    html += '    <span>📖 ' + totalLessons + ' جلسه</span>';
    html += '  </div>';
    html += '  <div class="cs-tags">';
    (c.tags || []).forEach(function (t) { html += '<span>' + t + '</span>'; });
    html += '  </div>';
    html += '  <div class="cs-instructor-chip"><span class="av">' + (c.instructor ? c.instructor.charAt(0) : '؟') + '</span>';
    html += '    <div><div class="nm">' + (c.instructor || 'نامشخص') + '</div><div class="rl">مدرس دوره</div></div></div>';
    html += '  </div>';

    // ── کارت خرید ──
    html += '  <div class="cs-buy-card">';
    html += '    <div class="cs-price-row">';
    if (c.price > 0) {
      html += '<span class="cs-price-current">' + c.price.toLocaleString('fa-IR') + ' تومان</span>';
      if (disc > 0) html += '<span class="cs-price-original">' + c.originalPrice.toLocaleString('fa-IR') + '</span>';
    } else {
      html += '<span class="cs-price-free">رایگان</span>';
    }
    html += '    </div>';

    if (enrolled) {
      html += '<a href="dashboard-student.html?course=' + c.id + '" class="cs-buy-btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">✓ ادامه یادگیری</a>';
    } else if (inCart) {
      html += '<a href="cart.html" class="cs-buy-btn secondary" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box">در سبد خرید — مشاهده سبد</a>';
    } else {
      html += '<button class="cs-buy-btn" id="csAddCart" data-id="' + c.id + '">' + (c.price > 0 ? 'افزودن به سبد خرید' : 'ثبت‌نام رایگان') + '</button>';
    }
    html += '    <ul class="cs-buy-facts">';
    html += '      <li><span>سطح</span><span>' + (c.level || '') + '</span></li>';
    html += '      <li><span>مدت زمان</span><span>' + (c.duration || '') + '</span></li>';
    html += '      <li><span>تعداد جلسات</span><span>' + totalLessons + '</span></li>';
    html += '      <li><span>دسترسی</span><span>مادام‌العمر</span></li>';
    html += '    </ul>';
    html += '  </div>';
    html += '</div></div></div>';

    // ── سرفصل‌ها ──
    html += '<div class="container"><div class="cs-section" style="margin-top:2.5rem">';
    html += '<h2>📚 سرفصل‌های دوره</h2>';
    chapters.forEach(function (ch, ci) {
      html += '<div class="chapter-block' + (ci === 0 ? ' open' : '') + '">';
      html += '  <div class="chapter-head"><span><span class="ch-num">' + (ci + 1) + '</span>' + ch.title + '</span>';
      html += '  <span><span class="ch-count">' + ch.lessons + ' جلسه</span> <span class="chevron">▾</span></span></div>';
      html += '  <div class="chapter-lessons">';
      for (var l = 1; l <= ch.lessons; l++) {
        html += '<div class="lesson-preview-row"><span>▶</span><span>جلسه ' + l + ': ' + ch.title + '</span></div>';
      }
      html += '  </div></div>';
    });
    html += '</div>';

    // ── دوره‌های مرتبط ──
    var related = allCourses.filter(function (x) { return x.category === c.category && x.id !== c.id; }).slice(0, 6);
    if (related.length) {
      html += '<div class="cs-section"><h2>دوره‌های مرتبط</h2><div class="related-scroll">';
      related.forEach(function (r) {
        html += '<a href="course-single.html?id=' + r.id + '" class="related-card">';
        html += '  <div class="r-icon">' + (r.icon || '📚') + '</div>';
        html += '  <div class="r-title">' + r.title + '</div>';
        html += '  <div class="r-price">' + (r.price > 0 ? r.price.toLocaleString('fa-IR') + ' ت' : 'رایگان') + '</div>';
        html += '</a>';
      });
      html += '</div></div>';
    }

    html += '</div>'; // container

    $('#csWrap').html(html);

    // ── رویدادها ──
    $('.chapter-head').on('click', function () { $(this).closest('.chapter-block').toggleClass('open'); });

    $('#csAddCart').on('click', function () {
      if (typeof Auth === 'undefined' || !Auth.isLoggedIn()) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }
      if (typeof Cart !== 'undefined' && Cart.addItem(c.id)) {
        if (typeof showNotification === 'function') showNotification('دوره به سبد اضافه شد');
        render(c, allCourses); // بازسازی برای نمایش وضعیت جدید دکمه
      }
    });
  }

});
</script>
<script>$(document).ready(function(){$("#mobileMenuBtn").on("click",function(){$(".nav-links").toggleClass("open")});});</script>
</body>
</html>
