<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منابع آموزشی — آئورا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
.resources-page{padding-top:80px;min-height:100vh}
.res-header{text-align:center;padding:3rem 0 2rem;background:linear-gradient(180deg,var(--bg-surface),var(--bg-deep))}
.res-header h1{font-size:2rem;font-weight:800;color:var(--text-primary);margin-bottom:.5rem}
.res-tabs{display:flex;gap:.5rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.res-tab{padding:.5rem 1rem;background:var(--bg-card);border:1px solid var(--border);border-radius:30px;font-size:.78rem;color:var(--text-muted);cursor:pointer;transition:all var(--ease)}
.res-tab.active{background:var(--accent-glow);border-color:var(--accent);color:var(--accent)}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem;padding:2rem 0 3rem}
.res-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem;transition:all var(--ease)}
.res-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
.res-card .res-icon{font-size:2rem;margin-bottom:.75rem}
.res-card h3{font-size:.9rem;font-weight:600;color:var(--text-primary);margin-bottom:.35rem}
.res-card p{font-size:.75rem;color:var(--text-muted);line-height:1.7;margin-bottom:.75rem}
.res-card .res-meta{display:flex;gap:1rem;font-size:.65rem;color:var(--text-muted);margin-bottom:.75rem}
.res-card .res-tags{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.75rem}
.res-card .res-tags span{padding:.15rem .4rem;background:var(--bg-deep);border-radius:10px;font-size:.58rem;color:var(--text-muted)}
</style>
</head>
<body>

<nav class="nav" id="mainNav"><div class="container">
<a href="/" class="nav-logo">آئو<span>را</span></a>
<ul class="nav-links">
  <li><a href="/">خانه</a></li>
  <li class="has-dropdown">
    <a href="#">خدمات <i data-lucide="chevron-down" class="dropdown-arrow"></i></a>
    <div class="nav-dropdown">
      <a href="/courses"><i data-lucide="book-open"></i> دوره‌ها</a>
      <a href="/professors"><i data-lucide="users"></i> اساتید</a>
      <a href="/students"><i data-lucide="graduation-cap"></i> دانشجویان</a>
      <a href="/meetings"><i data-lucide="video"></i> جلسات</a>
    </div>
  </li>
  <li class="has-dropdown active">
    <a href="#">پژوهش <i data-lucide="chevron-down" class="dropdown-arrow"></i></a>
    <div class="nav-dropdown">
      <a href="/research"><i data-lucide="folder-open"></i> نمونه‌کارها</a>
      <a href="/resources"><i data-lucide="library"></i> منابع</a>
    </div>
  </li>
  <li><a href="/forum"><i data-lucide="messages-square"></i> تالار گفتگو</a></li>
  <li><a href="/about"><i data-lucide="info"></i> درباره ما</a></li>
  <li><a href="/faq"><i data-lucide="help-circle"></i> سوالات</a></li>
</ul>
<div class="nav-actions"><a href="/cart" class="nav-cart"><i data-lucide="shopping-cart"></i> <span id="cartCount">0</span></a><div id="authArea"></div></div>
<button class="mobile-menu-btn" id="mobileMenuBtn"><i data-lucide="menu"></i></button>
</div></nav>

<div class="resources-page">
<div class="res-header">
<h1>📚 منابع آموزشی</h1>
<p style="font-size:.88rem;color:var(--text-muted)">کتاب‌ها، مقالات، ابزارها و ویدیوهای آموزشی</p>
<div class="res-tabs">
<div class="res-tab active" data-type="all">همه</div>
<div class="res-tab" data-type="book">📖 کتاب</div>
<div class="res-tab" data-type="article">📄 مقاله</div>
<div class="res-tab" data-type="tool">🛠 ابزار</div>
<div class="res-tab" data-type="video">🎥 ویدیو</div>
<div class="res-tab" data-type="dataset">💾 ابزار آنلاین</div>
</div>
</div>
<div class="container"><div class="res-grid" id="resGrid"></div></div>
</div>

<footer class="footer"><div class="container"><div class="footer-bottom"><span>© ۱۴۰۵ آئورا</span></div></div></footer>

<script src="js/ajax.js"></script>
<script src="js/app.js"></script>
<script>
var resources = [
  {type:'book',icon:'📖',title:'کارگردانی فیلم — از ایده تا اکران',desc:'راهنمای جامع کارگردانی فیلم و مستند — سید فیلد',tags:['کارگردانی','فیلم'],link:'#'},
  {type:'book',icon:'📖',title:'اصول تدوین فیلم',desc:'والتر مرچ — مرجع کلاسیک هنر تدوین',tags:['تدوین','فیلم'],link:'#'},
  {type:'tool',icon:'🛠',title:'DaVinci Resolve',desc:'نرم‌افزار رایگان و حرفه‌ای تدوین و کالرگریدینگ',tags:['تدوین','رایگان'],link:'https://www.blackmagicdesign.com/products/davinciresolve'},
  {type:'tool',icon:'🛠',title:'Adobe Premiere Pro',desc:'استاندارد صنعتی تدوین فیلم و ویدیو',tags:['تدوین','حرفه‌ای'],link:'#'},
  {type:'article',icon:'📄',title:'۱۰ نکته کلیدی فیلم‌برداری با دوردرون',desc:'راهنمای عملی فیلم‌برداری هوایی برای مستند و تبلیغات',tags:['دوردرون','فیلم‌برداری'],link:'#'},
  {type:'video',icon:'🎥',title:'آموزش Premiere از مبتدی تا پیشرفته',desc:'مجموعه ویدیوهای آموزشی تدوین با Premiere Pro',tags:['پریمیر','تدوین'],link:'#'},
  {type:'tool',icon:'🛠',title:'Audacity',desc:'نرم‌افزار رایگان ویرایش و میکس صدا',tags:['صدا','رایگان'],link:'https://audacityteam.org'},
  {type:'tool',icon:'🛠',title:'Canva',desc:'ابزار آنلاین طراحی گرافیک و موشن‌گرافیک',tags:['طراحی','آنلاین'],link:'https://canva.com'},
  {type:'article',icon:'📄',title:'اصول بازاریابی محتوایی',desc:'استراتژی تولید و توزیع محتوا برای رشد کسب‌وکار',tags:['بازاریابی','محتوا'],link:'#'},
  {type:'video',icon:'🎥',title:'آموزش صداگذاری حرفه‌ای',desc:'مبانی ضبط، ویرایش و میکس صدا برای فیلم و پادکست',tags:['صدا','صداگذاری'],link:'#'},
  {type:'tool',icon:'🛠',title:'After Effects',desc:'نرم‌افزار جلوه‌های ویژه و موشن‌گرافیک',tags:['VFX','موشن'],link:'#'},
  {type:'book',icon:'📖',title:'داستان‌نویسی برای فیلم‌نامه',desc:'روبرت مک‌کی — مرجع اصول داستان‌نویسی و فیلم‌نامه‌نویسی',tags:['فیلم‌نامه','داستان'],link:'#'}
];

$(document).ready(function(){
  renderRes(resources);
  $('.res-tab').on('click',function(){
    $('.res-tab').removeClass('active');
    $(this).addClass('active');
    var type = $(this).data('type');
    renderRes(type==='all'?resources:resources.filter(function(r){return r.type===type}));
  });

  function renderRes(items){
    var html='';
    items.forEach(function(r){
      html+='<div class="res-card"><div class="res-icon">'+r.icon+'</div>';
      html+='<h3>'+r.title+'</h3><p>'+r.desc+'</p>';
      html+='<div class="res-tags">';
      r.tags.forEach(function(t){html+='<span>'+t+'</span>';});
      html+='</div>';
      if(r.link && r.link!=='#') html+='<a href="'+r.link+'" target="_blank" class="btn-ghost" style="padding:.35rem .75rem;font-size:.72rem">مشاهده ↗</a>';
      html+='</div>';
    });
    $('#resGrid').html(html);
  }
});
</script>
<script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
</body>
</html>
